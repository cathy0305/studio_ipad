<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>03 — 흘러내리는 텍스트</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css"
  />
  <style>
    :root { color-scheme: light; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #FAFAFA;
      color: #1A1A1A;
      font-family: 'Pretendard Variable', -apple-system, system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
      overscroll-behavior: none;
    }

    #stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    canvas#scene {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .work-number {
      position: fixed;
      top: 28px;
      left: 28px;
      font-size: 13px;
      font-weight: 400;
      color: #B8B8B8;
      letter-spacing: 0.08em;
      z-index: 10;
      pointer-events: none;
    }

    /* === 진입 화면 === */
    #entry {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      transition: opacity 0.6s ease-in-out;
    }
    #entry.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #entry .label {
      font-size: 18px;
      font-weight: 300;
      color: #B8B8B8;
      letter-spacing: 0.02em;
      animation: pulse 2.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50%      { opacity: 1.0; }
    }

    /* === 디버그 === */
    #debug {
      position: fixed;
      bottom: 14px;
      right: 14px;
      font-size: 11px;
      color: #C8C8C8;
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      pointer-events: none;
      white-space: pre-line;
      text-align: right;
      z-index: 10;
      display: none;
    }
    #debug.visible { display: block; }
  </style>
</head>
<body>
  <div class="work-number">03</div>

  <div id="stage">
    <canvas id="scene"></canvas>
  </div>

  <div id="entry">
    <p class="label">화면을 터치하세요</p>
  </div>

  <div id="debug"></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
